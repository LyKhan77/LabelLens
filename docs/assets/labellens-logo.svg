<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="600" height="600">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4ADE80" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .logo-container {
      animation: float 6s ease-in-out infinite;
      transform-origin: center;
    }

    .tag-body {
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      fill-opacity: 0;
      animation: drawBody 1.5s ease-out forwards;
    }

    .top-dot {
      transform: scale(0);
      transform-origin: 198px 194px;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.5s forwards;
    }

    .bot-dot {
      transform: scale(0);
      transform-origin: 198px 318px;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 2.1s forwards;
    }

    .top-dash {
      width: 0;
      opacity: 0;
      animation: type 0.6s ease-out 1.7s forwards;
    }

    .bot-dash {
      width: 0;
      opacity: 0;
      animation: type 0.6s ease-out 2.3s forwards;
    }

    @keyframes drawBody {
      0% { stroke-dashoffset: 2000; fill-opacity: 0; }
      60% { stroke-dashoffset: 0; fill-opacity: 0; }
      100% { stroke-dashoffset: 0; fill-opacity: 1; }
    }

    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes type {
      0% { width: 0; opacity: 0; }
      10% { opacity: 1; }
      100% { width: 170px; opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <g class="logo-container" filter="url(#glow)">
    <path class="tag-body"
          d="M 120 100
             L 460 100
             A 30 30 0 0 1 490 130
             L 490 382
             A 30 30 0 0 1 460 412
             L 120 412
             Q 100 412 90 402
             L 40 352
             Q 30 342 30 322
             L 30 190
             Q 30 170 40 160
             L 90 110
             Q 100 100 120 100 Z"
          fill="#181A18" stroke="#4ADE80" stroke-width="8" stroke-linejoin="round" />

    <rect class="dot top-dot" x="170" y="170" width="56" height="48" rx="24" fill="#4ADE80" />
    <rect class="dash top-dash" x="250" y="170" width="170" height="48" rx="24" fill="#4ADE80" />
    <rect class="dot bot-dot" x="170" y="294" width="56" height="48" rx="24" fill="#4ADE80" />
    <rect class="dash bot-dash" x="250" y="294" width="170" height="48" rx="24" fill="#4ADE80" />
  </g>
</svg>
